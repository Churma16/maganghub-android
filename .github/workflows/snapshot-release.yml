name: Snapshot Pre-Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'CHANGELOG.md'
      - 'README.md'
      - '.github/workflows/manual-release.yml'
      - '.github/workflows/cleanup-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Unit & Lint Verification
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Release Scripts Unit Tests
        run: node --test tests/releaseScripts.test.js

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Android Unit Tests & Lint
        run: ./gradlew testDebugUnitTest --continue

  build:
    name: Build Signed Snapshot APK
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, 'chore(release):')"
    outputs:
      snapshot_tag: ${{ steps.snapshot_meta.outputs.snapshot_tag }}
      snapshot_apk: ${{ steps.snapshot_meta.outputs.snapshot_apk }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Compute Snapshot Metadata
        id: snapshot_meta
        run: |
          VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts)
          if [ -z "$VERSION" ]; then
            echo "[ERROR] Failed to extract versionName from app/build.gradle.kts"
            exit 1
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          SNAPSHOT_TAG="v${VERSION}-snapshot.${SHORT_SHA}"
          VERSION_SUFFIX="-snapshot.${SHORT_SHA}"
          SNAPSHOT_APK="maganghub-${SNAPSHOT_TAG}.apk"
          echo "snapshot_tag=$SNAPSHOT_TAG" >> $GITHUB_OUTPUT
          echo "version_suffix=$VERSION_SUFFIX" >> $GITHUB_OUTPUT
          echo "snapshot_apk=$SNAPSHOT_APK" >> $GITHUB_OUTPUT
          echo "VERSION_SUFFIX=$VERSION_SUFFIX" >> $GITHUB_ENV
          echo "SNAPSHOT_TAG=$SNAPSHOT_TAG" >> $GITHUB_ENV
          echo "SNAPSHOT_APK=$SNAPSHOT_APK" >> $GITHUB_ENV
          echo "[INFO] Computed snapshot tag: $SNAPSHOT_TAG"

      - name: Restore Release Keystore
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
            echo "[INFO] Release keystore restored from repository secret."
          else
            echo "[WARN] RELEASE_KEYSTORE_BASE64 not set, falling back to dynamic keystore."
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias maganghub \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass maganghub \
              -keypass maganghub \
              -dname "CN=MagangHub, OU=Churma, O=Churma, L=Jakarta, ST=Jakarta, C=ID"
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build Signed Release APK
        run: ./gradlew assembleRelease -PversionSuffix="${{ env.VERSION_SUFFIX }}" --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'maganghub' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'maganghub' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'maganghub' }}

      - name: Package Snapshot APK
        run: |
          APK_FILE=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK_FILE" "${{ env.SNAPSHOT_APK }}"
          echo "[INFO] Ready to publish snapshot APK: ${{ env.SNAPSHOT_APK }}"

      - name: Upload Snapshot APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: snapshot-apk
          path: ${{ env.SNAPSHOT_APK }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish Snapshot Pre-Release
    runs-on: ubuntu-latest
    needs: [test, build]
    steps:
      - name: Download Snapshot APK Artifact
        uses: actions/download-artifact@v4
        with:
          name: snapshot-apk

      - name: Publish Snapshot Pre-Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.snapshot_tag }}
          name: ${{ needs.build.outputs.snapshot_tag }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: ${{ needs.build.outputs.snapshot_apk }}
          body: |
            ### Snapshot Preview Build

            This is an automated snapshot pre-release built from commit `${{ github.sha }}` on `main`.

            Use this build to test bleeding-edge features and fixes on your Android device before the next official release.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
