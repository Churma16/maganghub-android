name: Build & Release Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build APK & Bundles
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
          else
            echo "gradlew not found yet"
          fi

      - name: Run Unit Tests & Lint
        run: |
          if [ -f gradlew ]; then
            ./gradlew testDebugUnitTest --continue || true
          fi

      - name: Build Debug APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --stacktrace
          fi

      - name: Build Release APK
        run: |
          if [ -f gradlew ]; then
            ./gradlew assembleRelease --stacktrace || ./gradlew assembleDebug --stacktrace
          fi

      - name: Locate Generated APKs
        id: find_apks
        run: |
          echo "Scanning for APK files..."
          find app/build/outputs/apk/ -name "*.apk" || find . -name "*.apk" || true
          
          DEBUG_APK=$(find . -name "*debug*.apk" | head -n 1)
          RELEASE_APK=$(find . -name "*release*.apk" | head -n 1)
          
          echo "DEBUG_APK=$DEBUG_APK" >> $GITHUB_ENV
          echo "RELEASE_APK=$RELEASE_APK" >> $GITHUB_ENV

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: env.DEBUG_APK != ''
        with:
          name: maganghub-debug-apk
          path: ${{ env.DEBUG_APK }}
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: env.RELEASE_APK != ''
        with:
          name: maganghub-release-apk
          path: ${{ env.RELEASE_APK }}
          retention-days: 30

      - name: Create GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.DEBUG_APK }}
            ${{ env.RELEASE_APK }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
