name: CI Verification

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Code & Test Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run Release Scripts Unit Tests
        run: node --test tests/releaseScripts.test.js

      - name: Verify No Manual Version Bumps in PR
        if: github.event_name == 'pull_request'
        run: node .github/scripts/verify-no-manual-version-bump.js
        env:
          BASE_REF: origin/${{ github.base_ref }}

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests & Lint
        run: ./gradlew testDebugUnitTest --continue

      - name: Restore Release Keystore
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-apk'))
        run: |
          if [ -n "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > release.jks
            echo "[INFO] Release keystore restored from repository secret."
          else
            echo "[WARN] RELEASE_KEYSTORE_BASE64 not set, falling back to dynamic keystore."
            keytool -genkeypair -v \
              -keystore release.jks \
              -alias maganghub \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass maganghub \
              -keypass maganghub \
              -dname "CN=MagangHub, OU=Churma, O=Churma, L=Jakarta, ST=Jakarta, C=ID"
          fi
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}

      - name: Build Signed Release APK
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-apk'))
        run: ./gradlew assembleRelease --stacktrace
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'maganghub' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'maganghub' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'maganghub' }}

      - name: Upload Build Artifact
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'build-apk'))
        uses: actions/upload-artifact@v4
        with:
          name: maganghub-pr-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 7
